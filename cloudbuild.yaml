# Google Cloud Build config for producing a Windows blender.exe that agents can
# use for Python-driven model updates, mode changes, sculpt/edit operations, etc.
#
# Prerequisite once per GCP project: build/publish the community windows-builder:
#   git clone https://github.com/GoogleCloudPlatform/cloud-builders-community.git
#   cd cloud-builders-community/windows-builder
#   gcloud builds submit --config=builder/cloudbuild.yaml builder/
#
# Also grant the Cloud Build service account Compute Engine permissions as
# documented by windows-builder, because this config starts a temporary Windows VM.
#
# Submit this repository with, for example:
#   gcloud builds submit --project spotlessbinco --config cloudbuild.yaml \
#     --substitutions=_ARTIFACT_BUCKET=YOUR_BUCKET_OR_BUCKET/PREFIX
#
# If _ARTIFACT_BUCKET is set, the Windows VM uploads:
#   gs://$_ARTIFACT_BUCKET/blender-codetether-windows-x64.zip
#   gs://$_ARTIFACT_BUCKET/blender-version.txt

substitutions:
  _ARTIFACT_BUCKET: ""
  _WINDOWS_BUILDER_IMAGE: "gcr.io/$PROJECT_ID/windows-builder"
  _WINDOWS_IMAGE: "projects/windows-cloud/global/images/family/windows-2022"
  _MACHINE_TYPE: "n2-standard-32"
  _DISK_SIZE_GB: "300"
  _ZONE: "us-central1-a"

# Blender builds can be long on a fresh VM.
timeout: "28800s" # 8 hours

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
  diskSizeGb: 100

steps:
  - id: "build-windows-blender"
    name: "${_WINDOWS_BUILDER_IMAGE}"
    args:
      - "--image"
      - "${_WINDOWS_IMAGE}"
      - "--zone"
      - "${_ZONE}"
      - "--machineType"
      - "${_MACHINE_TYPE}"
      - "--diskSizeGb"
      - "${_DISK_SIZE_GB}"
      - "--commandTimeout"
      - "420"
      - "--copyTimeout"
      - "120"
      - "--command"
      - >-
        powershell.exe -NoProfile -ExecutionPolicy Bypass
        -Command "$env:ARTIFACT_BUCKET='${_ARTIFACT_BUCKET}';
        C:\workspace\tools\codetether_windows_build.ps1"
