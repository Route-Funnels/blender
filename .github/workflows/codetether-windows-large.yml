name: CodeTether Windows Blender Build

on:
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Arguments passed to make.bat'
        required: false
        default: 'lite x64 2022 ninja verbose'
      runner:
        description: 'Runner label to use. Depot Windows runners avoid GitHub larger-runner queue delays.'
        required: false
        default: 'depot-windows-2022-16'

jobs:
  build-windows:
    name: Build Windows Blender on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      BUILD_ARGS: ${{ inputs.build_args }}
      CODETETHER_PACKAGE_NAME: blender-codetether-windows-x64

    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Fetch Blender source LFS files
        shell: pwsh
        run: |
          Remove-Item Env:\GIT_LFS_SKIP_SMUDGE -ErrorAction SilentlyContinue
          git remote add blender-project-lfs https://projects.blender.org/blender/blender.git
          git lfs fetch blender-project-lfs --include="release/datafiles/**,scripts/startup/bl_app_templates_system/**,assets/**" --exclude="tests/**"
          git lfs checkout

      - name: Verify build tools
        shell: pwsh
        run: |
          foreach ($tool in @('git', 'git-lfs', 'ninja', 'cmake')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool was not found on PATH"
            }
          }
          git lfs install --skip-smudge
          git lfs version
          ninja --version
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          Write-Host 'Installed Visual Studio instances:'
          & $vswhere -all -format json
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsInstall) { throw 'MSVC x64 tools not found on runner' }
          Write-Host "Using Visual Studio at $vsInstall"

      - name: Fetch Blender Windows libraries
        shell: pwsh
        run: |
          git submodule update --init --depth 1 scripts/addons_core
          git config --local submodule.lib/windows_x64.update checkout
          $env:GIT_LFS_SKIP_SMUDGE = '1'
          git submodule update --progress --init lib/windows_x64
          Remove-Item Env:\GIT_LFS_SKIP_SMUDGE -ErrorAction SilentlyContinue
          git -C lib/windows_x64 lfs pull

      - name: Build Blender
        shell: cmd
        run: |
          echo BUILD_ARGS=%BUILD_ARGS%
          call make.bat %BUILD_ARGS%

      - name: Locate blender.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path .. -Recurse -Filter blender.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'build_windows.*(bin|Release|install)' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw 'Could not locate blender.exe after build' }
          echo "BLENDER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "BLENDER_BIN_DIR=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $exe.FullName --version

      - name: Smoke test Agent MCP
        id: smoke
        if: env.BLENDER_EXE != ''
        continue-on-error: true
        shell: pwsh
        run: |
          '{"jsonrpc":"2.0","id":1,"method":"status","params":{}}' |
            & $env:BLENDER_EXE --background --agent-mcp | Tee-Object -FilePath agent_mcp_smoke_test_windows.json
          if (-not (Select-String -Path agent_mcp_smoke_test_windows.json -Pattern '"blender_version"' -Quiet)) {
            throw 'Agent MCP smoke test did not report blender_version'
          }

      - name: Package artifact
        if: env.BLENDER_BIN_DIR != ''
        shell: pwsh
        run: |
          $pkg = Join-Path $pwd $env:CODETETHER_PACKAGE_NAME
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Path (Join-Path $env:BLENDER_BIN_DIR '*') -Destination $pkg -Recurse -Force
          if (Test-Path agent_mcp_smoke_test_windows.json) {
            Copy-Item agent_mcp_smoke_test_windows.json -Destination $pkg -Force
          }
          if (Test-Path tools/codetether_blender_automation.py) {
            Copy-Item tools/codetether_blender_automation.py -Destination (Join-Path $pkg 'codetether_blender_automation.py') -Force
          }
          Compress-Archive -Path (Join-Path $pkg '*') -DestinationPath "$env:CODETETHER_PACKAGE_NAME.zip" -Force

      - name: Upload artifact
        if: env.BLENDER_BIN_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: blender-codetether-windows-x64-${{ github.run_id }}
          path: blender-codetether-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Fail if Agent MCP smoke test failed
        if: steps.smoke.outcome == 'failure'
        shell: pwsh
        run: throw 'Agent MCP smoke test failed, but the build artifact was still uploaded.'